# Agentium v2 Configuration
# Generated by 'agentium init'

[events]
dir = ".agentium/events"
enabled = true

[redact]
enabled = true
redact_keys = true
redact_emails = true

[fingerprint]
ignore = ["$.params.seed"]
normalize_whitespace = false
redact_before_hash = true

[gate]
mode = "shadow"  # options: "shadow", "enforce"

[adapters]
langgraph = { enabled = true }
crewai = { enabled = true }
openai_agents = { enabled = true }
